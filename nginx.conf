server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docusaurus generates directory-based routes with index.html files.
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  location ~* \.(?:css|js|mjs|json|xml|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
